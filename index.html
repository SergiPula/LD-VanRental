<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Van Rentals – Book your van online</title>
  <meta name="description" content="Rent a camper, cargo or passenger van. Check live availability and send a booking request in minutes." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <span class="brand" id="brandName">Van Rentals</span>
    </div>
  </header>

  <main class="wrap">
    <!-- Hero + progress -->
    <section class="hero">
      <h1>Pick your dates.<br />We’ll show the vans that are free.</h1>
      <ol class="stepper" aria-label="Booking progress">
        <li data-step="1" class="active">Choose a van</li>
        <li data-step="2">Your details</li>
        <li data-step="3">Done</li>
      </ol>
    </section>

    <!-- STEP 1: search + results -->
    <section id="step1" class="panel">
      <form id="searchForm" class="search-bar" novalidate>
        <label>Pickup date
          <input type="date" id="startDate" required />
        </label>
        <label>Return date
          <input type="date" id="endDate" required />
        </label>
        <label>Van type
          <select id="categoryFilter"><option value="">All types</option></select>
        </label>
        <button type="submit" class="btn btn-primary">Check availability</button>
      </form>
      <p id="searchError" class="error" role="alert" hidden></p>
      <p id="resultsInfo" class="muted" aria-live="polite"></p>
      <div id="results" class="grid"></div>
    </section>

    <!-- STEP 2: booking form -->
    <section id="step2" class="panel" hidden>
      <button type="button" id="backBtn" class="link-btn">← Back to vans</button>
      <div class="booking-layout">
        <form id="bookingForm" novalidate>
          <h2>Your details</h2>
          <label>Full name <input id="fullName" autocomplete="name" required minlength="2" /></label>
          <label>Email <input id="email" type="email" autocomplete="email" required /></label>
          <label>Phone <input id="phone" type="tel" autocomplete="tel" required minlength="6" /></label>
          <label>Driver’s license number <input id="license" required minlength="3" /></label>
          <!-- Honeypot: hidden from humans, bots fill it in -->
          <input id="website" name="website" tabindex="-1" autocomplete="off" class="hp" aria-hidden="true" />
          <p id="bookingError" class="error" role="alert" hidden></p>
          <button type="submit" id="submitBtn" class="btn btn-primary">Send booking request</button>
        </form>

        <aside class="summary" aria-label="Booking summary">
          <h2>Summary</h2>
          <img id="sumImg" alt="" />
          <p class="sum-name" id="sumName"></p>
          <dl>
            <dt>Pickup</dt><dd id="sumStart"></dd>
            <dt>Return</dt><dd id="sumEnd"></dd>
            <dt>Days</dt><dd id="sumDays"></dd>
            <dt>Price per day</dt><dd id="sumRate"></dd>
          </dl>
          <p class="total"><span>Total</span><strong id="sumTotal"></strong></p>
        </aside>
      </div>
    </section>

    <!-- STEP 3: confirmation -->
    <section id="step3" class="panel confirm" hidden>
      <div class="check" aria-hidden="true">✓</div>
      <h2>Thank you!</h2>
      <p>Your booking request has been submitted. We will contact you shortly.</p>
      <p class="muted" id="confirmRef"></p>
      <button type="button" id="newBookingBtn" class="btn btn-primary">Make another booking</button>
    </section>
  </main>

  <footer class="site-footer"><div class="wrap">© <span id="year"></span> Van Rentals</div></footer>

  <!-- supabase-js pinned to an exact version -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
